name: 我的相册 Android APK
on:
  push:
    branches: [ "private-gallery-app" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare release signing key when all secrets are configured
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            mkdir -p app/build/signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/build/signing/private-gallery-release.jks
            chmod 600 app/build/signing/private-gallery-release.jks
            echo "release_signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_signing_available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets incomplete; only debug APK will be built."
          fi
      - name: Build and test
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle testDebugUnitTest assembleDebug
          if [[ "${{ steps.signing.outputs.release_signing_available }}" == "true" ]]; then
            gradle assembleRelease
          fi
      - name: Verify APK package and signing
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT"
          verify_package() {
            "$AAPT" dump badging "$1" | grep -F "package: name='com.example.privategallery'" >/dev/null
            "$APKSIGNER" verify --print-certs "$1"
          }
          verify_package app/build/outputs/apk/debug/app-debug.apk
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            verify_package app/build/outputs/apk/release/app-release.apk
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAlbum-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed release APK
        if: steps.signing.outputs.release_signing_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MyAlbum-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error